<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>簿記3級 仕訳フラッシュカード</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#687386;--blue:#3659d9;--blue2:#e9edff;--green:#168653;--red:#c43e4d;--line:#e2e7f0;--shadow:0 10px 28px rgba(30,45,80,.09)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 34px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 18px}
h1{font-size:20px;line-height:1.3;margin:0}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.pill{background:var(--blue2);color:var(--blue);font-size:12px;font-weight:800;padding:7px 10px;border-radius:999px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat strong{display:block;font-size:21px}
.stat span{font-size:11px;color:var(--muted)}
.progress{height:6px;background:#e2e7f0;border-radius:9px;overflow:hidden;margin:0 0 16px}
.progress>div{height:100%;width:0;background:var(--blue);transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 18px;box-shadow:var(--shadow)}
.eyebrow{text-align:center;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em;display:none}
.question{font-size:25px;line-height:1.5;font-weight:850;text-align:center;margin:20px 0 8px;overflow-wrap:anywhere}
.hint{text-align:center;font-size:13px;color:var(--muted);min-height:20px;margin-bottom:20px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,select{font:inherit}
.answer{border:2px solid var(--line);background:white;border-radius:16px;padding:16px 8px;min-height:82px;font-weight:800;cursor:pointer;color:var(--ink);transition:.12s}
.answer .big{display:block;font-size:24px;margin-bottom:3px}
.answer .small{font-size:12px;color:var(--muted)}
.answer:active{transform:scale(.98)}
.answer:focus-visible,.btn:focus-visible,select:focus-visible{outline:3px solid #9eafff;outline-offset:2px}
.answer.correct{border-color:var(--green);background:#e9f8f0;color:var(--green)}
.answer.wrong{border-color:var(--red);background:#fff0f1;color:var(--red)}
.feedback{display:none;margin-top:15px;padding:13px;border-radius:14px;font-size:14px;line-height:1.6}
.feedback.show{display:block}
.feedback.good{background:#e9f8f0;color:#12683f}
.feedback.bad{background:#fff0f1;color:#9d2635}
.explain{display:block;margin-top:5px;font-weight:500}
.actions{display:flex;gap:9px;margin-top:15px}
.weak-toggle{display:block;width:100%;margin-top:10px;border:1px solid #e2b84b;background:#fff8df;color:#795b00;border-radius:12px;padding:10px;font-weight:800;cursor:pointer}
.weak-toggle.marked{background:#fff0c2;border-color:#d49b00}
.btn{border:0;border-radius:14px;padding:13px 14px;font-weight:800;cursor:pointer}
.primary{background:var(--blue);color:white;flex:1}
.secondary{background:#e9edf5;color:#344054}
.btn:disabled{opacity:.4;cursor:not-allowed}
.settings{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:15px}
.settings label{display:block;font-size:13px;font-weight:750;margin-bottom:8px}
select{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:11px;color:var(--ink)}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin:14px 2px 0}
kbd{font-family:inherit;background:#eef1f7;border-radius:5px;padding:2px 5px}
@media(max-width:360px){.question{font-size:22px}.card{padding:18px 13px}.answer{min-height:76px}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>簿記3級 仕訳フラッシュカード</h1><div class="sub">見た瞬間に「左・右」を判断する練習</div></div>
  <div class="pill">スマホ対応</div>
</header>
<section class="stats" aria-label="学習成績">
  <div class="stat"><strong id="total">0</strong><span>回答数</span></div>
  <div class="stat"><strong id="correct">0</strong><span>正解数</span></div>
  <div class="stat"><strong id="rate">—</strong><span>正解率</span></div>
</section>
<div class="progress" aria-label="正解率"><div id="progressBar"></div></div>

<section class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted)">
    <button class="weak-toggle" id="weakToggle" type="button" aria-pressed="false" style="display:inline-block;width:auto;margin-top:0;padding:8px 10px;flex-shrink:0">☆ 苦手チェック</button>
    <div style="display:flex;align-items:center;gap:6px">
      <label for="showCategory" style="margin:0;font-weight:600;cursor:pointer">勘定科目を表示</label>
      <input id="showCategory" type="checkbox" style="width:16px;height:16px;margin:0;cursor:pointer" aria-label="勘定科目の表示を切り替え">
    </div>
  </div>
  <div class="eyebrow" id="category">資産</div>
  <div class="question" id="question">売掛金が増えたら？</div>
  <div class="hint" id="hint">左右どちらに記入する？</div>
  <div class="answers">
    <button class="answer" data-side="left"><span class="big">左</span><span class="small">借方</span></button>
    <button class="answer" data-side="right"><span class="big">右</span><span class="small">貸方</span></button>
  </div>
  <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
  <div class="actions">
    <button class="btn secondary" id="skip">パス</button>
    <button class="btn primary" id="next" disabled>次のカード →</button>
  </div>
</section>

<section class="settings">
  <label for="mode">出題範囲</label>
  <select id="mode">
    <option value="all">全部（おすすめ）</option>
    <option value="weak">苦手チェックした問題だけ（増えた・減った）</option>
    <option value="asset">資産だけ</option>
    <option value="liability">負債だけ</option>
    <option value="equity">純資産だけ</option>
    <option value="revenue">収益だけ</option>
    <option value="expense">費用だけ</option>
  </select>
  <div style="margin-top:10px"><button class="btn secondary" id="reset" style="width:100%">成績をリセット</button></div>
</section>
<p class="note">基本ルール：<b>資産・費用は増えたら左</b>、<b>負債・純資産・収益は増えたら右</b>。減ったときは反対側！ まずはカードで反射的に答えられるようにしよう。</p>
</main>

  {name:"法人税、住民税及び事業税",type:"expense",label:"費用",rule:"費用",why:"法人税等を費用計上するときに使う。増えたら左、減ったら右。"},
  {name:"雑益",type:"revenue",label:"収益",rule:"収益",why:"本業以外で生じた少額の利益など。収益なので増えたら右、減ったら左。"},
  {name:"受取家賃",type:"revenue",label:"収益",rule:"収益",why:"建物などを貸して受け取る家賃は収益。増えたら右、減ったら左。"},
  {name:"受取地代",type:"revenue",label:"収益",rule:"収益",why:"土地を貸して受け取る地代は収益。増えたら右、減ったら左。"},
  {name:"発送費",type:"expense",label:"費用",rule:"費用",why:"商品発送にかかった費用として処理する場合は費用。問題文の条件に従う。"},
  {name:"固定資産除却損",type:"expense",label:"費用",rule:"費用",why:"固定資産を除却した際に生じる損失。費用・損失なので増えたら左、減ったら右。"},
  {name:"売上値引",type:"revenue",label:"収益の減少項目",rule:"収益の減少項目",increaseLeft:true,why:"売上の値引きは売上を減らす項目なので、発生・増加は左、減少は右。"},
  {name:"現金過不足",type:"special",label:"仮勘定",rule:"状況で左右が変わる",specialChanges:["不足が判明","過剰が判明"],why:"現金過不足は現金の実際有高と帳簿残高のズレを一時的に処理する勘定。不足なら借方（左）、過剰なら貸方（右）に記入する。"}
];
const typeNames = {asset:"資産",liability:"負債",equity:"純資産",revenue:"収益",expense:"費用"};
let current=null, answered=false, total=0, correct=0, seen=new Set();
const weakStorageKey="bokiFlashcardsWeakQuestions";
let weakQuestions=new Set();
try { weakQuestions=new Set(JSON.parse(localStorage.getItem(weakStorageKey)||"[]")); } catch(e) { weakQuestions=new Set(); }
function questionKey(card){return card.name+"|"+card.change;}
function saveWeakQuestions(){try{localStorage.setItem(weakStorageKey,JSON.stringify([...weakQuestions]));}catch(e){}}
function updateWeakButton(){
  const marked=!!current&&weakQuestions.has(questionKey(current));
  $("weakToggle").textContent=marked?"★ 苦手チェック済み":"☆ 苦手チェック";
  $("weakToggle").classList.toggle("marked",marked);
  $("weakToggle").setAttribute("aria-pressed",String(marked));
}
const $=id=>document.getElementById(id);
function pickCard(){
  const mode=$("mode").value;
  let pool=accounts.filter(a=>mode==="all"||a.type===mode||mode==="weak");
  let choices=[];
  pool.forEach(a=>(a.specialChanges||["増えた","減った"]).forEach(change=>choices.push({...a,change})));
  if(mode==="weak") choices=choices.filter(c=>
    weakQuestions.has(questionKey(c)) ||
    weakQuestions.has(c.name+"|"+((c.specialChanges||["増えた","減った"]).find(change=>change!==c.change)))
  );
  if(choices.length===0){
    current=null; answered=false;
    $("category").textContent="";
    $("question").textContent="苦手チェックした問題がありません";
    $("hint").textContent="通常モードで問題を苦手チェックしてください。";
    $("feedback").className="feedback"; $("feedback").innerHTML="";
    document.querySelectorAll(".answer").forEach(b=>{b.disabled=true;b.classList.remove("correct","wrong");});
    $("next").disabled=true; updateWeakButton(); return;
  }
  if(choices.length>1 && current){choices=choices.filter(c=>!(c.name===current.name&&c.change===current.change));}
  current=choices[Math.floor(Math.random()*choices.length)];
  answered=false;
  $("category").textContent=current.label+" · "+current.name;
  $("question").textContent=current.specialChanges ? current.name+"で「"+current.change+"」したら？" : current.name+"が"+current.change+"ら？";
  $("hint").textContent="この勘定科目は左右どっち？";
  $("feedback").className="feedback";
  $("feedback").innerHTML="";
  document.querySelectorAll(".answer").forEach(b=>{b.disabled=false;b.classList.remove("correct","wrong");});
  $("next").disabled=true;
  updateWeakButton();
}
function correctSide(c){
  // 現金過不足は増減ではなく、不足・過剰の判明状況で左右を判定する。
  if(c.name==="現金過不足") return c.change==="不足が判明" ? "left" : "right";
  // 通常は資産・費用が増えたら左。控除項目などはカードごとの例外設定を優先。
  const increaseLeft=(typeof c.increaseLeft==="boolean")
    ? c.increaseLeft
    : ["asset","expense"].includes(c.type);
  const left=(c.change==="増えた")?increaseLeft:!increaseLeft;
  return left?"left":"right";
}
function answer(side){
  if(answered)return;
  answered=true;
  const right=correctSide(current);
  const ok=side===right;
  total++; if(ok)correct++;
  $("total").textContent=total;
  $("correct").textContent=correct;
  $("rate").textContent=Math.round(correct/total*100)+"%";
  $("progressBar").style.width=(correct/total*100)+"%";
  document.querySelectorAll(".answer").forEach(b=>{
    b.disabled=true;
    if(b.dataset.side===right)b.classList.add("correct");
    else if(b.dataset.side===side&&!ok)b.classList.add("wrong");
  });
  const sideText=right==="left"?"左（借方）":"右（貸方）";
  const f=$("feedback");
  f.className="feedback show "+(ok?"good":"bad");
  f.innerHTML=(ok?"正解！ 🎉":"おしい！ 正解は"+sideText+"。")+"<span class='explain'>"+current.why+"<br>"+(current.specialChanges ? current.name+"で「"+current.change+"」の場合は" : current.name+"が"+current.change+"ら、")+sideText+"に記入。</span>";
  $("hint").textContent=ok?"いい感じ。その調子！":"ルールを確認して、次でリベンジ！";
  $("next").disabled=false;
}
document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answer(b.dataset.side)));
$("next").addEventListener("click",pickCard);
$("skip").addEventListener("click",pickCard);
$("mode").addEventListener("change",pickCard);
$("weakToggle").addEventListener("click",()=>{
  if(!current)return;
  const key=questionKey(current);
  if(weakQuestions.has(key)) weakQuestions.delete(key); else weakQuestions.add(key);
  saveWeakQuestions(); updateWeakButton();
  if($("mode").value==="weak"&&!weakQuestions.has(key)) pickCard();
});
$("showCategory").addEventListener("change",()=>{$("category").style.display=$("showCategory").checked?"block":"none";});
$("reset").addEventListener("click",()=>{total=0;correct=0;$("total").textContent="0";$("correct").textContent="0";$("rate").textContent="—";$("progressBar").style.width="0";pickCard();});
pickCard();
</script>
</body>
</html>
